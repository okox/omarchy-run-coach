[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "run-coach"
version = "1.2.0"
description = "Your running plan, checked against every run: Garmin/Strava import, HR zones, fitness trends, a web dashboard and bar output for Omarchy/Waybar."
readme = { text = "See https://github.com/okox/omarchy-run-coach", content-type = "text/plain" }
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
  "garmin-fit-sdk>=21.0",
  "garminconnect>=0.3",
  "requests>=2.31",
  "curl-cffi>=0.7",
]

[project.urls]
Homepage = "https://github.com/okox/omarchy-run-coach"

[project.scripts]
run-coach = "run_coach:main"

[tool.setuptools]
py-modules = ["run_coach"]

[tool.setuptools.data-files]
"share/run-coach" = ["dashboard.html", "example-plan.json", "PLAN.md"]
